[pytest]
# C 拥有的测试配置（总纲 §3.2 未指定归属；如与 A 的约定冲突以总纲为准）。
testpaths = tests
addopts = -ra --strict-markers
markers =
    e2e: 浏览器端到端用例，需要先启动服务并安装 Playwright（成员C指南 C04）
    slow: 明显耗时的用例，可按需 -m "not slow" 跳过

# 核心命令（不包含 e2e，可在服务未启动时安全执行）：
#   python -m pytest tests/test_api.py tests/test_statistics.py tests/test_workflow.py -q
# 浏览器链路（需要先启动服务，见 README「浏览器端到端测试」）：
#   python -m pytest tests/e2e -q
