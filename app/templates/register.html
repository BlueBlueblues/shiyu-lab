{% extends "base.html" %}
{% block title %}注册｜FirstOrder Lab{% endblock %}
{% block body_class %}page-auth{% endblock %}
{% block nav %}<nav class="site-nav"><a href="/login">登录</a></nav>{% endblock %}
{% block content %}
<section class="card">
  <h1>创建你的验证空间</h1>
  <p class="muted">你的项目、反馈和报告只对你可见。公开问卷的受访者无需账号。</p>
  <form id="auth-form" data-testid="auth-form" data-auth-action="register"
        method="post" action="/api/auth/register">
    <div class="field">
      <label for="username">用户名</label>
      <input id="username" name="username" autocomplete="username" required minlength="3" maxlength="32"
             pattern="[A-Za-z][A-Za-z0-9_-]*" aria-describedby="username-help">
      <p class="muted" id="username-help">3–32 位，以英文字母开头，可含数字、下划线和连字符。</p>
    </div>
    <div class="field">
      <label for="email">邮箱（可选）</label>
      <input id="email" name="email" type="email" autocomplete="email" maxlength="254">
    </div>
    <div class="field">
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required
             minlength="12" maxlength="128" aria-describedby="password-help">
      <p class="muted" id="password-help">12–128 位，建议使用较长且不重复的密码。</p>
    </div>
    <div class="field">
      <label for="password-confirmation">确认密码</label>
      <input id="password-confirmation" name="password_confirmation" type="password" autocomplete="new-password"
             required minlength="12" maxlength="128">
    </div>
    <p class="status" role="status" aria-live="polite" data-testid="auth-status"></p>
    <div class="field-errors" data-testid="auth-errors" hidden></div>
    <button class="button button-primary" type="submit" data-testid="auth-submit">注册</button>
  </form>
  <p>已有账号？<a href="/login">去登录</a></p>
</section>
{% endblock %}
